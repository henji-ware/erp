name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/example
      DATABASE_URL_UNPOOLED: postgresql://user:password@localhost:5432/example
      SESSION_SECRET: ci-only-session-secret-that-is-not-used-outside-the-run
      AI_ENCRYPTION_KEY: ci-only-encryption-secret-that-is-not-used-outside-the-run
      CRON_SECRET: ci-only-cron-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm run security:audit
