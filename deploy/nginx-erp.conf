# Nginx — proxy reverso para o ERP da DRR (Next.js em 127.0.0.1:3000).
# Copie para /etc/nginx/sites-available/erp, troque SEU_DOMINIO e ative.
# O certbot adiciona o bloco 443 (HTTPS) automaticamente.

server {
    listen 80;
    server_name SEU_DOMINIO;

    # Permite upload de propostas grandes (alinhado ao limite das Server Actions)
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
